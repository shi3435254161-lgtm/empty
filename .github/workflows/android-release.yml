name: Build Android APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install web dependencies
        run: npm ci

      - name: Build and sync Android web assets
        run: |
          npm run build:android-web
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare release artifact
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/kitchen-designer-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} Android test build
          generate_release_notes: true
          files: release/kitchen-designer-${{ github.ref_name }}-debug.apk
