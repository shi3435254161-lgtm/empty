<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>真实素材验收台</title>
    <style>
        :root { color-scheme: light; font-family: "Microsoft YaHei", system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-width: 1024px; color: #17221d; background: #edf1f0; }
        header { display: flex; align-items: center; justify-content: space-between; height: 62px; padding: 0 24px; background: #fff; border-bottom: 1px solid #d8e1dc; }
        h1 { margin: 0; font-size: 18px; letter-spacing: 0; }
        .summary { color: #5e6e66; font-size: 13px; }
        main { display: grid; grid-template-columns: 292px minmax(560px, 1fr) 292px; min-height: calc(100vh - 62px); }
        aside { min-height: 0; background: #fff; border-right: 1px solid #d8e1dc; }
        .asset-list { height: calc(100vh - 62px); overflow: auto; padding: 10px; }
        .asset-card { display: grid; width: 100%; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 11px; color: inherit; text-align: left; background: #fff; border: 1px solid transparent; border-radius: 6px; cursor: pointer; }
        .asset-card:hover { background: #f3f7f5; }
        .asset-card.selected { background: #e8f3ed; border-color: #98c5ad; }
        .asset-card strong, .asset-card span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .asset-card strong { font-size: 13px; }
        .asset-card span { margin-top: 4px; color: #64746c; font-size: 11px; }
        .asset-state { align-self: start; padding: 3px 5px; color: #35694d; background: #dcefe3; border-radius: 3px; font-size: 10px; font-weight: 700; }
        .asset-state.hold { color: #8a6518; background: #fbefd2; }
        .asset-state.rejected, .asset-state.failed { color: #a34343; background: #f7e4e4; }
        .stage { position: relative; min-width: 0; overflow: hidden; background: #e6ebea; }
        canvas { display: block; width: 100%; height: 100%; }
        .stage-label { position: absolute; left: 18px; top: 16px; padding: 7px 9px; color: #53645b; background: rgba(255,255,255,.83); border: 1px solid rgba(206,218,211,.9); border-radius: 5px; font-size: 12px; pointer-events: none; }
        .stage-label b { color: #1d2e25; }
        .stage-error { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; color: #973e3e; font-size: 14px; text-align: center; pointer-events: none; }
        .inspect { padding: 22px; border-left: 1px solid #d8e1dc; }
        .eyebrow { color: #5d9777; font-size: 10px; font-weight: 800; }
        h2 { margin: 5px 0 17px; font-size: 18px; line-height: 1.35; }
        dl { display: grid; gap: 13px; margin: 0; }
        dt { color: #76867d; font-size: 11px; }
        dd { margin: 4px 0 0; color: #26362d; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 24px; }
        button { font: inherit; }
        .actions button { height: 38px; color: #fff; background: #29483a; border: 0; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .actions button.secondary { color: #29483a; background: #fff; border: 1px solid #bdd0c5; }
        .notice { margin-top: 20px; padding-top: 16px; color: #65766d; border-top: 1px solid #dde5e1; font-size: 11px; line-height: 1.65; }
    </style>
</head>
<body>
    <header>
        <h1>真实素材验收台</h1>
        <div id="summary" class="summary">正在读取素材清单</div>
    </header>
    <main>
        <aside><div id="asset-list" class="asset-list" aria-label="真实素材列表"></div></aside>
        <section class="stage" aria-label="素材空间预览">
            <canvas id="viewer"></canvas>
            <div id="stage-label" class="stage-label">准备中</div>
            <div id="stage-error" class="stage-error" hidden></div>
        </section>
        <aside class="inspect">
            <span class="eyebrow">ASSET INSPECTION</span>
            <h2 id="asset-name">准备中</h2>
            <dl>
                <div><dt>授权</dt><dd id="asset-license">-</dd></div>
                <div><dt>作者</dt><dd id="asset-author">-</dd></div>
                <div><dt>来源</dt><dd id="asset-source">-</dd></div>
                <div><dt>使用模块</dt><dd id="asset-modules">-</dd></div>
                <div><dt>文件大小</dt><dd id="asset-size">-</dd></div>
                <div><dt>验收状态</dt><dd id="asset-status">等待加载</dd></div>
            </dl>
            <div class="actions">
                <button id="previous" class="secondary" type="button">上一个</button>
                <button id="next" type="button">下一个</button>
            </div>
            <p class="notice">这里只出现本地实际可加载的 GLTF/GLB。程序化柜体、假品牌外形和加载失败素材不会计入真实素材库。</p>
        </aside>
    </main>

    <script src="js/vendor/three.min.js"></script>
    <script src="js/vendor/OrbitControls.js"></script>
    <script src="js/vendor/GLTFLoader.js"></script>
    <script src="js/vendor/meshopt_decoder.js"></script>
    <script src="js/vendor/RGBELoader.js"></script>
    <script src="js/polyhaven-assets.generated.js?v=20260731-cc0-window-v2"></script>
    <script src="js/incoming-assets.generated.js?v=20260801-sketchfab-audit-v1"></script>
    <script src="js/model-assets.js?v=20260801-sketchfab-review-v2"></script>
    <script>
        (() => {
            const canvas = document.getElementById('viewer');
            const listElement = document.getElementById('asset-list');
            const labelElement = document.getElementById('stage-label');
            const errorElement = document.getElementById('stage-error');
            const state = { selected: 0, asset: null, model: null, status: new Map(), loading: 0 };
            const modulesByAsset = new Map();
            const rawAssets = window.MODEL_ASSETS || {};
            const assetsById = new Map();

            Object.entries(rawAssets).forEach(([moduleId, variants]) => {
                (Array.isArray(variants) ? variants : [variants]).forEach(asset => {
                    // The audit is deliberately broader than the editor. Every local GLTF/GLB
                    // must be seen in a real room before it can be approved for the module library.
                    if (!asset?.url || !/\.(gltf|glb)(?:$|[?#])/i.test(asset.url)) return;
                    const id = asset.id || asset.url;
                    if (!assetsById.has(id)) assetsById.set(id, asset);
                    if (!modulesByAsset.has(id)) modulesByAsset.set(id, []);
                    modulesByAsset.get(id).push(moduleId);
                });
            });
            const assets = Array.from(assetsById.values()).sort((a, b) => String(a.name).localeCompare(String(b.name), 'zh-CN'));

            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            const scene = new THREE.Scene();
            scene.background = new THREE.Color('#e9efed');
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            pmremGenerator.compileEquirectangularShader();
            if (THREE.RGBELoader) {
                new THREE.RGBELoader().load('assets/hdris/studio_small_09_2k.hdr', texture => {
                    const environment = pmremGenerator.fromEquirectangular(texture).texture;
                    texture.dispose();
                    pmremGenerator.dispose();
                    scene.environment = environment;
                }, undefined, () => {
                    pmremGenerator.dispose();
                });
            } else {
                pmremGenerator.dispose();
            }
            const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
            camera.position.set(3.2, 2.1, 4.6);
            const controls = new THREE.OrbitControls(camera, canvas);
            controls.target.set(0, 0.9, 0);
            controls.enableDamping = true;
            controls.minDistance = 2.1;
            controls.maxDistance = 8;
            const hemi = new THREE.HemisphereLight('#fbfdfd', '#7d8b83', 2.1);
            scene.add(hemi);
            const key = new THREE.DirectionalLight('#ffffff', 3.2);
            key.position.set(3, 5, 4);
            key.castShadow = true;
            key.shadow.mapSize.set(1024, 1024);
            scene.add(key);
            const fill = new THREE.DirectionalLight('#d6e7df', 1.4);
            fill.position.set(-4, 2, -3);
            scene.add(fill);
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(18, 18),
                new THREE.MeshStandardMaterial({ color: '#d2d9d5', roughness: 0.77, metalness: 0 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
            const auditContext = new THREE.Group();
            scene.add(auditContext);

            function addBlock(width, height, depth, x, y, z, color, roughness = 0.48) {
                const mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(width, height, depth),
                    new THREE.MeshPhysicalMaterial({ color, roughness, metalness: 0.02, clearcoat: 0.08 })
                );
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                auditContext.add(mesh);
                return mesh;
            }

            function setupAuditContext(asset) {
                auditContext.clear();
                const modules = modulesByAsset.get(asset.id || asset.url) || [];
                const isBath = modules.some(id => id.startsWith('bath-'));
                const wall = isBath ? '#f5f5f3' : '#f3f5f4';
                addBlock(5.9, 3.0, 0.12, 0, 1.5, -2.5, wall, 0.68);
                addBlock(5.9, 0.1, 4.9, 0, 2.95, -0.15, '#ffffff', 0.62);
                addBlock(0.14, 3.0, 4.9, -2.88, 1.5, -0.15, '#f8faf9', 0.68);

                if (isBath) {
                    addBlock(1.25, 0.7, 0.48, -1.95, 0.35, -2.1, '#d7ddde');
                    addBlock(1.37, 0.06, 0.57, -1.95, 0.73, -2.1, '#fbfcfc', 0.22);
                    addBlock(1.18, 0.8, 0.04, -1.95, 1.55, -2.28, '#e7ebea', 0.18);
                    addBlock(1.16, 0.03, 0.05, -1.95, 1.55, -2.24, '#111719', 0.18);
                    addBlock(0.84, 2.1, 0.06, 2.12, 1.05, -2.25, '#dce7e7', 0.24);
                    addBlock(0.08, 2.12, 0.1, 1.73, 1.05, -2.15, '#1d2628', 0.28);
                } else {
                    addBlock(1.42, 0.72, 0.56, -1.95, 0.36, -2.1, '#3a4448');
                    addBlock(1.56, 0.07, 0.66, -1.95, 0.76, -2.1, '#fbfcfc', 0.2);
                    addBlock(1.42, 0.72, 0.56, 1.95, 0.36, -2.1, '#3a4448');
                    addBlock(1.56, 0.07, 0.66, 1.95, 0.76, -2.1, '#fbfcfc', 0.2);
                    addBlock(1.36, 0.7, 0.32, -1.95, 2.08, -2.22, '#ffffff', 0.3);
                    addBlock(1.36, 0.7, 0.32, 1.95, 2.08, -2.22, '#ffffff', 0.3);
                    addBlock(0.5, 1.55, 0.02, 0, 1.58, -2.42, '#d8dddc', 0.72);
                }
            }
            const loader = new THREE.GLTFLoader();
            if (window.MeshoptDecoder && typeof loader.setMeshoptDecoder === 'function') {
                loader.setMeshoptDecoder(window.MeshoptDecoder);
            }

            function formatBytes(bytes) {
                if (!Number.isFinite(bytes)) return '未知';
                return bytes >= 1024 * 1024 ? `${(bytes / 1024 / 1024).toFixed(2)} MB` : `${Math.round(bytes / 1024)} KB`;
            }

            function removeCurrentModel() {
                if (!state.model) return;
                state.model.traverse(node => {
                    if (!node.isMesh) return;
                    node.geometry?.dispose();
                    const materials = Array.isArray(node.material) ? node.material : [node.material];
                    materials.filter(Boolean).forEach(material => material.dispose());
                });
                scene.remove(state.model);
                state.model = null;
            }

            function updateInfo(asset, status) {
                const id = asset.id || asset.url;
                const review = window.getAssetReview?.(asset) || { status: 'unreviewed', note: '尚未进行空间验收。' };
                document.getElementById('asset-name').textContent = asset.name || id;
                document.getElementById('asset-license').textContent = asset.license || '未声明';
                document.getElementById('asset-author').textContent = asset.author || '未声明';
                const source = document.getElementById('asset-source');
                source.innerHTML = '';
                if (asset.sourceUrl) {
                    const link = document.createElement('a');
                    link.href = asset.sourceUrl;
                    link.target = '_blank';
                    link.rel = 'noreferrer';
                    link.textContent = asset.sourceUrl;
                    source.appendChild(link);
                } else source.textContent = '未声明';
                document.getElementById('asset-modules').textContent = (modulesByAsset.get(id) || []).join('、') || '未关联模块';
                document.getElementById('asset-size').textContent = formatBytes(asset.bytes);
                const reviewText = { approved: '通过，可进入主库', hold: '暂缓，不进入主库', rejected: '淘汰，不进入主库', unreviewed: '未验收，不进入主库' }[review.status] || review.status;
                document.getElementById('asset-status').textContent = `${reviewText}。${review.note} 当前加载：${status}`;
            }

            function renderList() {
                listElement.innerHTML = '';
                assets.forEach((asset, index) => {
                    const id = asset.id || asset.url;
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = `asset-card${index === state.selected ? ' selected' : ''}`;
                    const review = window.getAssetReview?.(asset) || { status: 'unreviewed' };
                    const loadStatus = state.status.get(id);
                    const status = loadStatus?.startsWith('失败') ? '加载失败' : (review.status === 'approved' ? '已验收' : review.status === 'hold' ? '暂缓' : review.status === 'rejected' ? '淘汰' : '待验收');
                    const stateClass = review.status === 'hold' ? ' hold' : review.status === 'rejected' ? ' rejected' : status.startsWith('失败') ? ' failed' : '';
                    button.innerHTML = `<span><strong>${asset.name || id}</strong><span>${asset.license || '未声明'} · ${(modulesByAsset.get(id) || []).join(' / ')}</span></span><i class="asset-state${stateClass}">${status}</i>`;
                    button.addEventListener('click', () => selectAsset(index));
                    listElement.appendChild(button);
                });
            }

            function frameModel(model, asset) {
                const rotation = Number(asset.rotation);
                if (Number.isFinite(rotation) && rotation !== 0) {
                    model.rotation.y = THREE.MathUtils.degToRad(rotation);
                    model.updateMatrixWorld(true);
                }
                const bounds = new THREE.Box3().setFromObject(model);
                const size = bounds.getSize(new THREE.Vector3());
                const center = bounds.getCenter(new THREE.Vector3());
                const maxDimension = Math.max(size.x, size.y, size.z, 0.001);
                const scale = 2.15 / maxDimension;
                model.scale.setScalar(scale);
                const modules = modulesByAsset.get(asset.id || asset.url) || [];
                const isCounterAsset = modules.some(id => id === 'cooktop' || id === 'decor-cutting-board' || id === 'decor-tea-set' || id.includes('vase'));
                const surfaceHeight = isCounterAsset ? 0.78 : 0;
                model.position.set(-center.x * scale, -bounds.min.y * scale + surfaceHeight, -center.z * scale);
                controls.target.set(0, Math.min(1.35, Math.max(0.5, size.y * scale / 2 + surfaceHeight)), 0);
                camera.position.set(3.45, 2.28, 5.1);
                controls.update();
            }

            function selectAsset(index) {
                state.selected = (index + assets.length) % assets.length;
                const asset = assets[state.selected];
                const request = ++state.loading;
                removeCurrentModel();
                setupAuditContext(asset);
                errorElement.hidden = true;
                labelElement.textContent = `加载中：${asset.name}`;
                updateInfo(asset, '正在加载');
                renderList();
                history.replaceState(null, '', `?asset=${encodeURIComponent(asset.id || asset.url)}`);
                loader.load(asset.url, gltf => {
                    if (request !== state.loading) return;
                    const model = gltf.scene || gltf.scenes?.[0];
                    if (!model) throw new Error('模型不含场景');
                    model.traverse(node => {
                        if (!node.isMesh) return;
                        node.castShadow = true;
                        node.receiveShadow = true;
                    });
                    state.model = model;
                    scene.add(model);
                    frameModel(model, asset);
                    state.status.set(asset.id || asset.url, '已加载');
                    labelElement.innerHTML = `<b>${asset.name}</b> · 实际 GLTF/GLB 明亮厨卫空间预览`;
                    updateInfo(asset, '已加载，可人工审看');
                    renderList();
                }, undefined, error => {
                    if (request !== state.loading) return;
                    const message = error?.message || '加载失败';
                    state.status.set(asset.id || asset.url, `失败`);
                    labelElement.textContent = `加载失败：${asset.name}`;
                    errorElement.textContent = `该素材无法在本地空间正确加载。\n${message}`;
                    errorElement.hidden = false;
                    updateInfo(asset, `加载失败：${message}`);
                    renderList();
                });
            }

            function resize() {
                const rect = canvas.parentElement.getBoundingClientRect();
                renderer.setSize(rect.width, rect.height, false);
                camera.aspect = rect.width / Math.max(rect.height, 1);
                camera.updateProjectionMatrix();
            }
            window.addEventListener('resize', resize);
            document.getElementById('previous').addEventListener('click', () => selectAsset(state.selected - 1));
            document.getElementById('next').addEventListener('click', () => selectAsset(state.selected + 1));
            document.addEventListener('keydown', event => {
                if (event.key === 'ArrowLeft') selectAsset(state.selected - 1);
                if (event.key === 'ArrowRight') selectAsset(state.selected + 1);
            });
            const preferred = new URLSearchParams(location.search).get('asset');
            const preferredIndex = assets.findIndex(asset => (asset.id || asset.url) === preferred);
            state.selected = preferredIndex >= 0 ? preferredIndex : 0;
            const approvedCount = assets.filter(asset => window.getAssetReview?.(asset)?.status === 'approved').length;
            document.getElementById('summary').textContent = `${assets.length} 个真实 GLTF/GLB · 已验收 ${approvedCount} 个 · 程序化占位不计入`;
            resize();
            renderList();
            selectAsset(state.selected);
            renderer.setAnimationLoop(() => {
                controls.update();
                renderer.render(scene, camera);
            });
        })();
    </script>
</body>
</html>
